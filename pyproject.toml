[project]
name = "insider-study"
version = "0.1.0"
description = "Rigorous quantitative study of CFO / insider open-market purchases (SEC Forms 3/4/5)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "structlog>=24.4",
    "mlflow-skinny>=2.17,<4",
    "exchange-calendars>=4.5,<5",
]

[project.scripts]
insider-study = "insider_study.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insider_study"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT", "DTZ"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # third-party: exchange_calendars uses generic numpy timedelta units
    "ignore::DeprecationWarning:exchange_calendars.*",
]
markers = [
    "network: test requires internet access (deselected in CI by default)",
]
