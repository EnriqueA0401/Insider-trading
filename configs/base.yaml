# Base configuration — mirrors the pre-registration in docs/HYPOTHESES.md.
# Sensitivity runs override individual keys; never edit this file to chase results.
seed: 20261021

splits:
  train_start: 2004-01-01
  train_end: 2014-12-31
  validation_start: 2015-01-01
  validation_end: 2019-12-31
  holdout_start: 2020-01-01
  holdout_end: 2025-12-31

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  # SEC fair-access policy: identify yourself. Override via config overlay.
  sec_user_agent: "insider-study research contact@example.com"
  sec_max_requests_per_second: 8.0
  first_year: 2003          # one extra year of history for the routine/opportunistic lookback
  last_year: 2025
  price_source: yfinance
  delisting_return_primary: -0.30
  delisting_return_sensitivities: [0.0, -1.0]
  max_unpriced_event_share: 0.15

filters:
  eligible_trans_codes: ["P"]
  eligible_form_types: ["4", "4/A"]
  max_filing_lag_days: 30
  exclude_10b5_1: true
  max_price_deviation: 0.25

signal:
  entry_lag_sessions: 1     # first NYSE session strictly after filing date
  entry_price: open
  horizons_months: [1, 3, 6, 12]
  primary_horizon_months: 6
  routine_lookback_years: 3
  cluster_min_insiders: 3
  cluster_window_days: 30
  conviction_terciles_expanding: true

portfolio:
  aum_usd: 1000000
  capacity_grid_usd: [100000, 250000, 500000, 1000000, 2500000, 5000000, 10000000, 25000000, 50000000]
  rebalance: monthly
  weighting: equal
  max_position_weight: 0.05
  long_only: true
  universes: [all, mid_large]

costs:
  commission_per_share: 0.005
  commission_min_usd: 1.0
  spread_model: corwin_schultz
  half_spread_floor_bps: 5
  half_spread_cap_bps: 500
  impact_coefficient: 1.0
  max_adv_participation: 0.10
  adv_window_days: 20
  cost_multipliers: [0.5, 2.0]

benchmark:
  market_tickers: [IWM]
  baseline: all_insiders
  factor_model: ff5_umd

validation:
  max_trials: 200
  alpha_level: 0.05
  holdout_alpha_level: 0.10
  min_dsr: 0.95
  max_pbo: 0.5
  cpcv_groups: 10
  cpcv_test_groups: 2

tracking:
  experiment_name: cfo-insider-study
  tracking_uri: file:./mlruns
  trial_registry_path: trials/registry.jsonl
